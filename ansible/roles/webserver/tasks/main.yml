---
- name: Install nginx
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: present

- name: Create document root
  ansible.builtin.file:
    path: "{{ app_document_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Deploy site configuration
  ansible.builtin.template:
    src: playground.conf.j2
    dest: /etc/nginx/sites-available/playground.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable playground site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/playground.conf
    dest: /etc/nginx/sites-enabled/playground.conf
    state: link
  notify: Reload nginx

- name: Disable default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Deploy index page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ app_document_root }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Ensure nginx is started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true