---
# One controller (your laptop or the "control" container) runs playbooks against all hosts here.
all:
  vars:
    ansible_user: "{{ lookup('env', 'ANSIBLE_SSH_USER') | default('ansible', true) }}"
    ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_PRIVATE_KEY_HOST_PATH') | default('../ssh/ansible_control_ed25519', true) }}"
    lab_environment: "{{ lookup('env', 'LAB_ENVIRONMENT') | default('lab', true) }}"
    app_name: "{{ lookup('env', 'APP_NAME') | default('ansible-playground', true) }}"
    app_owner: "{{ lookup('env', 'APP_OWNER') | default('ito', true) }}"
  children:
    managed:
      children:
        webservers:
          hosts:
            web01:
              ansible_host: "{{ lookup('env', 'WEB01_SSH_HOST') | default('127.0.0.1', true) }}"
              ansible_port: "{{ lookup('env', 'WEB01_SSH_PORT') | default('2221', true) }}"
            web02:
              ansible_host: "{{ lookup('env', 'WEB02_SSH_HOST') | default('127.0.0.1', true) }}"
              ansible_port: "{{ lookup('env', 'WEB02_SSH_PORT') | default('2222', true) }}"